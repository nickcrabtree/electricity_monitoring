# /etc/systemd/system/logrotate.service.d/low-priority.conf on flint (a Pi Zero W: one 1 GHz core, SD card). The
# first rotation after 2026-11-21 compresses about 2.3 GB of old logs; run it at the lowest CPU and disk priority so
# the 5 s Tuya poller is not starved while it works. See flint-electricity-monitoring for the install commands.
[Service]
Nice=19
IOSchedulingClass=idle
